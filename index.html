<!DOCTYPE html>
<html lang="es">
<head>

    <title>Gestor Estudiantes</title>
</head>
<body>

        <h1>Gestor Estudiantes</h1>

        <!-- ZONA PUNTO 1: Formulario (Juliana) -->

        <select v-model="filtroCarrera">

</select>

</select>

        <!-- ZONA PUNTO 5: Mensajes vacíos y PUNTO 2: Lista -->

        <p v-for="e in estudiantesFiltrados" :key="e.id">{{ e.nombre }} - {{ e.calificacion }}</p>
